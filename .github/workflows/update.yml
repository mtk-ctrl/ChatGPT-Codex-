name: Collect reset records and publish

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'counter-ingest/**'
      - 'data/**'
      - 'docs/assets/**'
      - '.github/workflows/update.yml'

permissions:
  contents: read

concurrency:
  group: reset-site-main
  cancel-in-progress: false

jobs:
  update:
    # The owner's requirement is zero additional fees. Never allocate a runner
    # for the private repository, where the account's paid usage could apply.
    if: ${{ toJSON(github.event.repository.private) == 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          # A manual re-run must also start from the latest saved history.
          ref: main
      - name: Run data and publishing checks
        run: |
          python3 -m unittest discover -s tests -v
          node --test tests/test_counter.mjs
      - name: Collect OpenAI primary data (retain verified history on failure)
        id: collect
        continue-on-error: true
        run: python3 scripts/site.py refresh --github-output "$GITHUB_OUTPUT"
      - name: Build readable HTML and current collection status
        run: python3 scripts/site.py build
      - name: Save records and the meaningful collector health report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json data/health.json data/forecast-history.json docs
          if ! git diff --cached --quiet; then
            git commit -m "chore: update reset records and collector health [skip ci]"
            git push
          fi
      - name: Summarize collection and first-time publishing setup
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          records = json.loads(Path("data/events.json").read_text())
          health = json.loads(Path("data/health.json").read_text())
          summary = [
              "## ChatGPT リセット履歴の更新結果",
              "",
              f"- 保存済み履歴: {len(records)}件",
              f"- 取得状態: {health.get('feed', 'unknown')}",
              f"- X取得状態: {health.get('x_status', 'unknown')}",
              f"- 最終取得成功（UTC）: {health.get('last_success_at') or '未確認'}",
              "",
              "初回の配信設定: [Settings → Pages](https://github.com/mtk-ctrl/ChatGPT-Codex-/settings/pages) "
              "の Source を **GitHub Actions** にしてください。設定済みなら変更は不要です。",
              "",
              "公開完了は、この実行の Publish ステップが成功したことを確認してください。",
          ]
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("\n".join(summary) + "\n")
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload the static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
          retention-days: 1
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report a collection failure after preserving the published data
        if: steps.collect.outcome == 'failure'
        run: |
          echo "::warning::OpenAI/X primary-source requests were blocked. Previously verified records remain published. Details: data/health.json."
          exit 0
